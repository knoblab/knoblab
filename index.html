<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>knoblab</title>

<link rel="icon" type="image/svg+xml" href="img/logo.svg" />

<script src="https://cdn.tailwindcss.com"></script>

<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['"IBM Plex Sans"', '"Pretendard"', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'monospace'],
        }
      }
    }
  }
</script>

<!-- React / ReactDOM / Babel -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="root"></div>

<!-- Babel standalone이 ES 모듈 구문을 안전하게 변환할 수 있도록 data-type="module" 지정 -->
<script type="text/babel" data-type="module" src="app/icons.js"></script>
<script type="text/babel" data-type="module" src="app/overview.js"></script>
<script type="text/babel" data-type="module" src="app/projects.js"></script>
<script type="text/babel" data-type="module" src="app/specs.js"></script>
<script type="text/babel" data-type="module" src="app/contact.js"></script>
<script type="text/babel" data-type="module" src="app.js"></script>
</body>
</html>
